name: Build Android

# Builds DropFlow for Android (android/): unit tests, debug and release APKs, then the signed release APK as the artifact
# "DropFlow-android.apk". Called from another workflow (for example release.yml) with the version; can also be run by hand.
#
# Signing: the release keystore never lives in the repository. Create these repository secrets:
#   ANDROID_KEYSTORE_BASE64   the .jks file, base64-encoded on one line
#   ANDROID_KEYSTORE_PASSWORD the keystore password
#   ANDROID_KEY_ALIAS         the key alias (dropflow)
#   ANDROID_KEY_PASSWORD      the key password
# Without ANDROID_KEYSTORE_BASE64 the job still builds and tests everything, then FAILS on purpose: an unsigned APK is
# never published.

on:
  workflow_call:
    inputs:
      version:
        description: "Version, e.g. v0.2.0 or 0.2.0 (major.minor.patch)"
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.2.0"
        required: true
        default: "0.0.1"
        type: string

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Version from the input
        id: v
        env:
          VERSION: ${{ inputs.version }}
        run: |
          v="${VERSION#v}"
          if ! [[ "$v" =~ ^[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then echo "::error::Version '$VERSION' must be major.minor.patch"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Unit tests, debug and release builds
        run: ./gradlew --stacktrace testDebugUnitTest assembleDebug assembleRelease "-Pdropflow.versionName=${{ steps.v.outputs.version }}"

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Require the signing key (no unsigned release is ever published)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_B64" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Android signing secrets are missing:$missing. The APKs were built and tested, but an unsigned release is not published. See android/README.md."
            exit 1
          fi

      - name: Build the signed release APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          DROPFLOW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DROPFLOW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DROPFLOW_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export DROPFLOW_KEYSTORE="$RUNNER_TEMP/dropflow-release.jks"
          echo "$KEYSTORE_B64" | base64 --decode > "$DROPFLOW_KEYSTORE"
          ./gradlew --stacktrace assembleRelease "-Pdropflow.versionName=${{ steps.v.outputs.version }}" -Pdropflow.requireSigning=true
          rm -f "$DROPFLOW_KEYSTORE"

      - name: Verify the signature and name the artifact
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::Signed APK not found ($apk)"; exit 1; }
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          cp "$apk" ../DropFlow-android.apk
          sha256sum ../DropFlow-android.apk

      - uses: actions/upload-artifact@v7
        with:
          name: DropFlow-android.apk
          path: DropFlow-android.apk
          if-no-files-found: error

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/dropflow-release.jks"
