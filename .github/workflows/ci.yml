name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Catalog is valid and generated files are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node catalog/build.mjs
      - name: Generated files must be committed
        run: git diff --exit-code -- docs/feature-catalog.md web/src/data/catalog.json

  desktop:
    name: Windows build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build DropFlow.sln -c Release
      - name: Test (engines are absent on CI, so engine tests skip visibly)
        run: dotnet test DropFlow.sln -c Release --no-build --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  web:
    name: Website lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # `npm ci` rejects the lockfile on Linux (npm bug: a lock made on Windows lacks the wasm32 @emnapi entries),
      # so install normally; the lockfile still pins every other version.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - name: Unit tests (when present)
        run: npm run --if-present test
