name: macOS feasibility

# The shared libraries (Core, all engines, AI) on Apple Silicon with Homebrew FFmpeg, qpdf and Tesseract (+ Arabic). Kept as a
# one-click macOS-only run; the steps live in build-cross.yml, which also covers Linux x64/arm64 and Windows on ARM64.
# The first measurement (2026-10-21, before the platform layer) is recorded in docs/macos.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-libraries:
    uses: ./.github/workflows/build-cross.yml
    with:
      runners: '["macos-latest"]'
