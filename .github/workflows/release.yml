name: Release

# Push a tag like v0.1.0 to build the installer, the update feed and the CLI, and publish them as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read # lets the optional SignPath step read this run's artifacts

# Optional code signing through SignPath Foundation (docs/code-signing-policy.md, docs/signpath-application.md).
# It is OFF while the repository variable SIGNPATH_ENABLED is not 'true'; every "SignPath:" step is then skipped and the release is
# built unsigned. The repository defines all SignPath variables (SIGNPATH_ENABLED=false, SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG,
# SIGNPATH_SIGNING_POLICY_SLUG, SIGNPATH_BINARIES_CONFIGURATION_SLUG, SIGNPATH_INSTALLER_CONFIGURATION_SLUG) and the secret
# SIGNPATH_API_TOKEN with placeholder values; after SignPath approves the project, put the real values there and set SIGNPATH_ENABLED=true.
# Each signed release needs two manual approvals in SignPath: DropFlow's own binaries, then the installer.

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from the tag
        id: v
        shell: pwsh
        run: echo "version=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test DropFlow.sln -c Release

      - name: Publish the app (self-contained)
        run: >
          dotnet publish src/DropFlow.App -c Release -r win-x64 --self-contained
          -p:Version=${{ steps.v.outputs.version }} -o publish/app

      - name: Bundle the helper programs (FFmpeg, qpdf, Tesseract + Arabic data) so users download nothing
        shell: pwsh
        run: |
          ./tools/fetch-engines.ps1
          Copy-Item tools/engines publish/app/engines -Recurse
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md publish/app

      - name: Publish the CLI
        run: >
          dotnet publish src/DropFlow.Cli -c Release -r win-x64 --self-contained
          -p:Version=${{ steps.v.outputs.version }} -o publish/cli

      - name: "SignPath: check the configuration"
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if (-not $env:SIGNPATH_API_TOKEN -or $env:SIGNPATH_API_TOKEN -eq 'not-set') { throw "SIGNPATH_ENABLED is true but the SIGNPATH_API_TOKEN secret still holds its placeholder." }

      - name: "SignPath: collect DropFlow's own binaries (never FFmpeg, qpdf, Tesseract or third-party DLLs)"
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force signing/unsigned/app, signing/unsigned/cli | Out-Null
          $own = { $_.Name -like 'DropFlow*.exe' -or $_.Name -like 'DropFlow*.dll' }   # -like ignores case: also dropflow.exe
          Get-ChildItem publish/app -File | Where-Object $own | Copy-Item -Destination signing/unsigned/app
          Get-ChildItem publish/cli -File | Where-Object $own | Copy-Item -Destination signing/unsigned/cli
          Get-ChildItem signing/unsigned -Recurse -File | ForEach-Object { $_.FullName }

      - name: "SignPath: upload the unsigned binaries"
        id: unsigned-binaries
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-binaries
          path: signing/unsigned
          if-no-files-found: error

      - name: "SignPath: sign the binaries (approve the request in SignPath)"
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_BINARIES_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-binaries.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.v.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signing/signed

      - name: "SignPath: put the signed binaries back and verify them"
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: pwsh
        run: |
          Copy-Item signing/signed/app/* publish/app -Force
          Copy-Item signing/signed/cli/* publish/cli -Force
          Get-ChildItem signing/signed -Recurse -File | ForEach-Object {
            $s = Get-AuthenticodeSignature $_.FullName
            if ($s.Status -ne 'Valid') { throw "$($_.Name) is not validly signed: $($s.Status)" }
            "$($_.Name): $($s.SignerCertificate.Subject)"
          }

      - name: Install Velopack's packer
        run: dotnet tool install -g vpk

      - name: Fetch the previous release so deltas can be built (first release has none)
        continue-on-error: true
        run: vpk download github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack the installer and update feed
        # vpk never signs here: SignPath signs only DropFlow's own files, never the bundled third-party programs.
        run: >
          vpk pack --packId DropFlow --packTitle DropFlow --packVersion ${{ steps.v.outputs.version }}
          --packDir publish/app --mainExe DropFlow.exe --icon src/DropFlow.App/Assets/dropflow.ico

      - name: "SignPath: upload the unsigned installer"
        id: unsigned-installer
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: Releases/DropFlow-win-Setup.exe
          if-no-files-found: error

      - name: "SignPath: sign the installer (approve the second request in SignPath)"
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.v.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signing/signed-installer

      - name: "SignPath: put the signed installer back and verify it"
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: pwsh
        run: |
          Copy-Item signing/signed-installer/DropFlow-win-Setup.exe Releases/DropFlow-win-Setup.exe -Force
          $s = Get-AuthenticodeSignature Releases/DropFlow-win-Setup.exe
          if ($s.Status -ne 'Valid') { throw "DropFlow-win-Setup.exe is not validly signed: $($s.Status)" }
          "DropFlow-win-Setup.exe: $($s.SignerCertificate.Subject)"

      - name: Zip the CLI and write checksums
        shell: pwsh
        run: |
          Compress-Archive -Path publish/cli/* -DestinationPath Releases/dropflow-cli-win-x64.zip
          Get-ChildItem Releases -File | Where-Object { $_.Name -notlike '*.json' -and $_.Name -notlike 'SHA256SUMS*' } |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Out-File Releases/SHA256SUMS.txt -Encoding ascii

      - name: Publish the GitHub Release
        run: >
          vpk upload github --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }} --publish --releaseName "DropFlow ${{ steps.v.outputs.version }}" --tag ${{ github.ref_name }}

      - name: Attach the CLI zip and checksums
        run: gh release upload ${{ github.ref_name }} Releases/dropflow-cli-win-x64.zip Releases/SHA256SUMS.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "SignPath: link the code signing policy from the release page (SignPath Foundation requires it)"
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: pwsh
        run: |
          $notes = gh release view ${{ github.ref_name }} --json body --jq .body
          $policy = "${{ github.server_url }}/${{ github.repository }}/blob/main/docs/code-signing-policy.md"
          $line = "Code signing policy: $policy" + [Environment]::NewLine + [Environment]::NewLine +
            "Free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org)"
          (($notes, $line) -join ([Environment]::NewLine * 2)).Trim() | Set-Content release-notes.md -Encoding utf8
          gh release edit ${{ github.ref_name }} --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
