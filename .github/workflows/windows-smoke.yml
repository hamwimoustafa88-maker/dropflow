name: Windows smoke

# Starts the real DropFlow app on GitHub's Windows images and checks it comes up: tray app starts, the low-level mouse/keyboard hooks
# install, no crash. windows-2025 shares the Windows 11 24H2 code base (build 26100); windows-2022 is the Windows 10 / 21H2 base.
# It cannot replace a person dragging files on a real Windows 11 PC (no real display scaling, no physical input) — see docs/status.md.
on:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: OS version
        shell: pwsh
        run: |
          [Environment]::OSVersion.VersionString
          (Get-CimInstance Win32_OperatingSystem | Select-Object Caption, BuildNumber, OSArchitecture | Format-List | Out-String)
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
      - name: Publish the app
        run: dotnet publish src/DropFlow.App -c Release -r win-x64 --self-contained -o publish/app
      - name: Launch and wait for the hooks
        shell: pwsh
        run: |
          $p = Start-Process publish/app/DropFlow.exe -PassThru
          $log = $null
          for ($i = 0; $i -lt 40 -and -not $log; $i++) {
            Start-Sleep -Seconds 1
            $log = Get-ChildItem "$env:LOCALAPPDATA\DropFlow" -Recurse -Filter dropflow.log -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($log -and -not (Select-String -Path $log.FullName -Pattern "input hooks installed" -Quiet)) { $log = $null }
          }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("screen.png")
          Get-ChildItem "$env:LOCALAPPDATA\DropFlow" -Recurse -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { "--- $($_.FullName)"; Get-Content $_.FullName -Tail 40 }
          if (-not $log) { throw "the app did not report 'input hooks installed' within 40 s" }
          if ($p.HasExited) { throw "the app exited early with code $($p.ExitCode)" }
          "OK: running on $((Get-CimInstance Win32_OperatingSystem).BuildNumber), hooks installed."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-${{ matrix.os }}
          path: screen.png
