org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Signing is never configured here. See android/README.md: the keystore path and passwords come from
# ~/.gradle/gradle.properties (dropflow.storeFile ...) or the DROPFLOW_KEYSTORE* environment variables.
# The Kotlin compile daemon could not be reached on the dev machine; compiling inside the Gradle daemon is reliable.
kotlin.compiler.execution.strategy=in-process
